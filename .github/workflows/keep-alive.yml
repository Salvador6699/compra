name: Keep Supabase Alive

on:
  schedule:
    # Se ejecuta cada 3 días a las 07:00 UTC (evita la pausa por inactividad de 7 días de Supabase)
    - cron: '0 7 */3 * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions de GitHub

jobs:
  ping:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Realizar consulta Keep-Alive a Supabase
        run: |
          echo "Enviando ping de actividad a Supabase..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_ZMilzyij7w4DKs9pTJNEUA_8J5GAfBG' }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_ZMilzyij7w4DKs9pTJNEUA_8J5GAfBG' }}" \
            "https://pobuahqtimuiftfuvmfm.supabase.co/rest/v1/products?select=id&limit=1")

          echo "Código de respuesta Supabase: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ Supabase está activo y respondiendo correctamente. ¡Proyecto mantenido con vida!"
          else
            echo "⚠️ Código de estado recibido: $HTTP_STATUS"
          fi
